apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: billing

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - ingress.yaml

# O cd.yml troca a imagem pela do ECR com a tag do commit:
#   kustomize edit set image billing-service=<registry>/billing-service:<sha>
images:
  - name: billing-service
    newName: billing-service
    newTag: latest
